[package]
name = "the-bridge-flash-loan-v2"
version = "1.0.0"
edition = "2021"
description = "THE-BRIDGE Flash Loan Engine V2 — Manager-based (Aave V3 & Uniswap V3)"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1"
thiserror = "1"
ethers = { version = "2", features = ["rustls"] }
reqwest = { version = "0.12", features = ["json"] }
dashmap = "6"
parking_lot = "0.12"
async-trait = "0.1"
hex = "0.4"
