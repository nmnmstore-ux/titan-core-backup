[workspace]
resolver = "2"
members = [
    "core",
    "flash-loan",
    "flash-loan-v2",
    "arbitrage",
    "mev-protection",
    "chaos",
    "integration",
    "cross-venue-arb",
    "super-arb",
    "A-core-infrastructure/config-manager",
]
default-members = ["."]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/user/the-bridge"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["connect"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = { version = "0.1", features = ["attributes", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
parking_lot = "0.12"
dashmap = "6"
crossbeam = "0.8"
bytes = "1"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
tiny-keccak = "2.0"
secp256k1 = { version = "0.28", features = ["rand", "recovery", "global-context"] }
alloy-primitives = "0.8"
alloy-sol-types = "0.8"
alloy-rlp = "0.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
http = "1"
jsonwebtoken = "9"
ring = "0.17"
rustls = "0.23"
rustls-pemfile = "2"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
ethers = { version = "2", features = ["rustls"] }
ethers-solc = "2"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.20"
diesel = { version = "2", features = ["postgres", "r2d2", "uuid", "chrono", "numeric"] }
diesel-derive-enum = { version = "2", features = ["postgres"] }
r2d2 = "0.8"
lazy_static = "1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"

wasmtime = "14"

tikv-jemallocator = "0.6"
io-uring = "0.6"
compact_str = { version = "0.8", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
async-trait = "0.1"
once_cell = { version = "1", features = ["std"] }
page_size = "0.6"
aes-gcm = "0.10"
aead = "0.5"
blake2 = "0.10"
crc32fast = "1"
x25519-dalek = "2"
tokio-rustls = "0.26"
tower-http = { version = "0.6", features = ["cors"] }
num_cpus = "1"
libc = "0.2"
base64 = "0.22"

[package]
name = "the-bridge-matching-engine"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/user/the-bridge"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "matching-engine"
path = "src/main.rs"

[[bin]]
name = "api-server"
path = "src/main_new.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "performance_benchmark"
path = "tests/performance_benchmark.rs"

[[test]]
name = "fix_gateway_test"
path = "tests/fix_gateway_test.rs"

[[test]]
name = "consensus_multinode_test"
path = "tests/consensus_multinode_test.rs"

[[test]]
name = "load_test"
path = "tests/load_test.rs"

[features]
default = []
wasm = []
flash-loan = []
arbitrage = []
mev = []
chaos = []
integration = []

