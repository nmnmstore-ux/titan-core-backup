[package]
name = "swiftbridge-vampire-core"
version = "1.0.0"
edition = "2021"
description = "Autonomous Liquidity Vampire Attack Engine — Layer 6: Sovereign Cyber-Growth & Infiltration Matrix"

[dependencies]
tokio = { version = "1", features = ["full", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
blake3 = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
