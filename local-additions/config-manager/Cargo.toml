[package]
name = "config-manager"
version = "0.1.0"
edition = "2021"
description = "Centralized configuration management system for THE-BRIDGE matching engine"
authors = ["THE-BRIDGE Team"]
license = "AGPL-3.0"
repository = "https://github.com/the-bridge/the-bridge"

[dependencies]
# Core serialization and deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "2.0"
toml = "0.8"

# Security and encryption
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
base64 = "0.21"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.4", features = ["cors", "trace", "fs"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Time and serialization
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Logging and observability
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

# Configuration and validation
config = "0.13"
validator = "0.16"
dep_fn = "0.2"

# Database
sea-orm = { version = "0.12", features = ["sqlx-all", "runtime-tokio-native-tls"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "uuid", "json"] }

# Caching
redis = "0.22"
lapin = "2.0"

# Background tasks
cron = "0.5"
async-cron-scheduler = "0.2"

# WebSocket
async-tungstenite = { version = "0.20", features = ["tokio-native-tls"] }
websocket = "0.26"

# Authentication and authorization
jsonwebtoken = "9.0"
password-hash = { version = "0.5", features = ["bcrypt", "salt"] }
pbkdf2 = "0.12"

# Utilities
itertools = "0.12"
fraction = "0.13"
serde_yaml = "0.9"
url = "2.0"
thiserror = "1.0"
arc_swap = "0.5"
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
anyhow = "1.0"
mockall = "0.12"
wiremock = "0.5"
