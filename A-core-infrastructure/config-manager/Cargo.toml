[package]
name = "config-manager"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Centralized configuration management for THE-BRIDGE matching engine"
repository = "https://github.com/anomalyco/the-bridge"
readme = "README.md"
keywords = ["config", "management", "encryption", "security"]
categories = ["security", "web-programming", "cryptography"]

[lib]
name = "config_manager"
crate-type = ["rlib"]

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
secrecy = "0.8"

# Encryption
aes-gcm = "0.10"
base64 = "0.21"

# Random generation
rand = { version = "0.8", features = ["std", "getrandom"] }

# Error handling
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
