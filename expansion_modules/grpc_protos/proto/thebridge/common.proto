syntax = "proto3";

package thebridge;

option optimize_for = SPEED;
option go_package = "github.com/user/the-bridge/gen/thebridge;thebridge";
option java_package = "com.thebridge.grpc";
option java_multiple_files = true;
option java_outer_classname = "CommonProto";

message Empty {}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Money {
  string amount = 1;
  string currency = 2;
  uint32 decimals = 3;
}

message WalletAddress {
  string address = 1;
  string chain_id = 2;
  AddressKind kind = 3;
}

enum AddressKind {
  ADDRESS_KIND_UNSPECIFIED = 0;
  ADDRESS_KIND_EOA = 1;
  ADDRESS_KIND_CONTRACT = 2;
  ADDRESS_KIND_CUSTODIAL = 3;
}

message TransactionId {
  string id = 1;
  string chain_id = 2;
  uint64 block_number = 3;
  uint32 log_index = 4;
}

message RequestMeta {
  string request_id = 1;
  string trace_id = 2;
  string module = 3;
  Timestamp issued_at = 4;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 3;
  ERROR_CODE_DEADLINE_EXCEEDED = 4;
  ERROR_CODE_NOT_FOUND = 5;
  ERROR_CODE_ALREADY_EXISTS = 6;
  ERROR_CODE_PERMISSION_DENIED = 7;
  ERROR_CODE_RESOURCE_EXHAUSTED = 8;
  ERROR_CODE_FAILED_PRECONDITION = 9;
  ERROR_CODE_ABORTED = 10;
  ERROR_CODE_OUT_OF_RANGE = 11;
  ERROR_CODE_UNIMPLEMENTED = 12;
  ERROR_CODE_INTERNAL = 13;
  ERROR_CODE_UNAVAILABLE = 14;
  ERROR_CODE_UNAUTHENTICATED = 16;
}

message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  string domain = 3;
  map<string, string> metadata = 4;
  Timestamp occurred_at = 5;
}
