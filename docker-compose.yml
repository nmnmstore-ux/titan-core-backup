services:
  postgres:
    image: postgres:16-alpine
    container_name: the-bridge-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: thebridge
      POSTGRES_USER: thebridge
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - the-bridge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thebridge"]
      interval: 5s
      timeout: 3s
      retries: 5

  the-bridge:
    build: .
    container_name: the-bridge-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
      - "4001:4001"
      - "4002:4002"
      - "4443:4443"
    environment:
      THE_BRIDGE_NODE_ID: ${NODE_ID:-engine-1}
      THE_BRIDGE_WAL_DIR: /var/lib/the-bridge/wal
      THE_BRIDGE_ISO20022_DIR: /var/lib/the-bridge/iso20022
      DATABASE_URL: postgres://thebridge:${PG_PASSWORD:-changeme}@postgres:5432/thebridge
      WAL_ENCRYPTION_KEY: ${WAL_ENCRYPTION_KEY:?err}
      WAL_SIGNING_SEED: ${WAL_SIGNING_SEED:?err}
      FIX_TLS_CERT: ${FIX_TLS_CERT:-}
      FIX_TLS_KEY: ${FIX_TLS_KEY:-}
      RUST_LOG: ${RUST_LOG:-the_bridge=info}
      RUST_BACKTRACE: 1
    volumes:
      - wal_data:/var/lib/the-bridge/wal
      - iso20022_data:/var/lib/the-bridge/iso20022
      - ./certs:/etc/the-bridge/certs:ro
    cap_add:
      - IPC_LOCK
    networks:
      - the-bridge-net

  caddy:
    image: caddy:2-alpine
    container_name: the-bridge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - ./certs:/certs:ro
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - the-bridge
    networks:
      - the-bridge-net

  prometheus:
    image: prom/prometheus:latest
    container_name: the-bridge-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - the-bridge-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: the-bridge-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - the-bridge-net

  grafana:
    image: grafana/grafana:latest
    container_name: the-bridge-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - the-bridge-net

volumes:
  pg_data:
  wal_data:
  iso20022_data:
  caddy_data:
  prometheus_data:
  grafana_data:

networks:
  the-bridge-net:
    driver: bridge
